apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform
subjects:
  - kind: ServiceAccount
    name: platform
---
# listing nodes is needed to show them in the shell (including empty ones)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploy-playground-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploy-playground-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deploy-playground-nodes
subjects:
  - kind: ServiceAccount
    name: platform
    namespace: deploy-playground
