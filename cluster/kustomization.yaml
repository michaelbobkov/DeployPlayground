apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deploy-playground
resources:
  - namespace.yaml
  - rbac.yaml
  - platform.yaml
# The code is mounted from ConfigMaps: no images to build or load into the cluster (node:22-alpine is enough).
# deploy.ps1 restarts the platform after a code update (rollout restart).
configMapGenerator:
  - name: platform-code
    files:
      - platform/server.js
  - name: site-code
    files:
      - site/server.js
      - site/index.html
      - site/common.js
generatorOptions:
  disableNameSuffixHash: true
